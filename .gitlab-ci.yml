stages:
  - install
  - lint
  - test
  - build
  - deploy

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

variables:
  MONGODB_URI: "mongodb://mongo:27017"
  MONGODB_DB: "lista_test"

install:
  stage: install
  script:
    - npm ci
  artifacts: {}

lint:
  stage: lint
  script:
    - npx eslint . --ext .js,.jsx,.ts,.tsx
  allow_failure: true

test:
  stage: test
  services:
    - name: mongo:7
      alias: mongo
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 week

deploy:
  stage: deploy
  script:
    - echo 'TODO deployment steps'
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
